<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>김정은 키우기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sunburst" aria-hidden="true"></div>

<main class="app" id="app">
  <div class="play">
  <header class="masthead">
    <div class="masthead-text">
      <p class="eyebrow" data-i18n="eyebrow">최고존엄 육성 시뮬레이션</p>
      <h1 data-i18n="title">김정은 키우기</h1>
    </div>
    <div class="masthead-tools">
      <label class="lang-pick">
        <span class="visually-hidden" data-i18n="langLabel">언어</span>
        <select id="lang-select"></select>
      </label>
      <button class="tool-btn" id="btn-music" type="button" aria-pressed="false" hidden>🔇 음악</button>
      <button class="tool-btn" id="btn-album" type="button" data-i18n="album">엔딩 도감</button>
      <button class="tool-btn" id="btn-restart" type="button" data-i18n="restart">처음부터</button>
    </div>
  </header>

  <section class="calendar" data-i18n-aria="ariaProgress" aria-label="진행 상황">
    <div class="calendar-top">
      <span class="stage-chip" id="stage-chip">아기 정은</span>
      <span class="day-label" id="day-label"><b>1</b>일째 <small>/ 70일</small></span>
    </div>
    <div class="day-track" id="day-track"><div class="day-fill" id="day-fill"></div></div>
    <div class="badges">
      <span class="badge" id="badge-weight">체중 3.4kg</span>
      <span class="badge" id="badge-money" hidden>외화 $150</span>
      <span class="badge badge-quiet" id="badge-age">0살</span>
    </div>
  </section>

  <section class="stage" id="stage" data-i18n-aria="ariaStage" aria-label="정은이">
    <div class="backdrop" id="backdrop"></div>
    <div class="kim" id="kim"></div>
    <p class="bubble" id="bubble">응애!</p>
    <div class="fx-layer" id="fx-layer" aria-hidden="true"></div>
    <div class="ticker">
      <span class="ticker-tag" data-i18n="breaking">속보</span>
      <div class="ticker-viewport"><p class="ticker-text" id="ticker-text">인민 여러분, 백두산 정기를 받은 아기가 태어났습니다!</p></div>
    </div>
  </section>

  <section class="stats" id="stats" data-i18n-aria="ariaStats" aria-label="상태 지표"></section>

  <section class="actions" data-i18n-aria="ariaActions" aria-label="오늘의 일정">
    <div class="section-head">
      <h2 data-i18n="scheduleTitle">오늘의 일정</h2>
      <p data-i18n="scheduleHint">일정 하나를 고르면 하루가 지나갑니다 · 숫자키 1–8</p>
    </div>
    <div class="action-grid" id="action-grid"></div>
  </section>
  </div>

  <section class="news" data-i18n-aria="ariaNews" aria-label="인민 속보">
    <div class="section-head">
      <h2 data-i18n="newsTitle">인민 속보</h2>
      <span class="onair">ON AIR</span>
    </div>
    <ol class="news-list" id="news-list"></ol>
  </section>

  <footer class="foot" data-i18n="footer">이 게임은 정치 풍자 패러디입니다.</footer>
</main>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-art" id="modal-art"></div>
    <p class="modal-kicker" id="modal-kicker"></p>
    <h2 id="modal-title"></h2>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="events.js"></script>
<script src="i18n.js"></script>
<script src="lang-en.js"></script>
<script src="lang-en-events.js"></script>
<script src="lang-zh.js"></script>
<script src="lang-zh-events.js"></script>
<script src="lang-ja.js"></script>
<script src="lang-ja-events.js"></script>
<script src="anthem.js"></script>
<script src="art.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
